# Placeholder values — replace before installing.
namespace: match

clusterName: match-reference-architecture # used to derive default k8s secret names

refreshInterval: 1h

serviceAccount:
  name: match-secrets
  # Cloud-provider IAM annotations for workload identity, e.g.:
  #   GKE: iam.gke.io/gcp-service-account: <GSA email>
  #   EKS: eks.amazonaws.com/role-arn: <IAM role ARN>
  annotations: {}

secretStore:
  name: gcp-secret-store
  # The SecretStore provider spec, passed through verbatim. Replace with the
  # block for your backend (gcpsm, aws, vault, ...). Example for GCP Secret
  # Manager with Workload Identity:
  provider:
    gcpsm:
      projectID: my-gcp-project
      auth:
        workloadIdentity:
          clusterLocation: us-central1 # GKE cluster location (region or zone)
          clusterName: match-reference-architecture
          serviceAccountRef:
            name: match-secrets
  # Example for AWS Secrets Manager with IRSA (the SA needs the
  # eks.amazonaws.com/role-arn annotation above):
  # provider:
  #   aws:
  #     service: SecretsManager
  #     region: us-east-1
  #     auth:
  #       jwt:
  #         serviceAccountRef:
  #           name: match-secrets

# Secret Manager secret names (Terraform outputs / manually created).
secretNames:
  cloudSql: match-reference-architecture-cloud-sql # tf-dt-cloud-sql (gcp) / tf-dt-rds-pg (aws)
  redis: match-reference-architecture-redis        # tf-dt-memorystore (gcp) / tf-dt-elasticache-redis (aws)
  api: match-reference-architecture-api-secrets    # gcp/tf-hosted-modules/tf-dt-application-secrets (gcp) / aws/tf-hosted-modules/tf-dt-application-secrets (aws)
  user: match-reference-architecture-user-password # gcp/tf-hosted-modules/tf-dt-application-secrets (gcp) / aws/tf-hosted-modules/tf-dt-application-secrets (aws)
  docker: match-docker-secret                      # manually created (gcloud / aws)
  honeybadger: match-honeybadger-secret            # manually created (gcloud / aws)

# k8s Secret names produced. 
k8sSecretNames:
  rdsPg: match-postgres-credentials
  api: match-api-secrets
  user: match-owning-user-credentials
  redis: "" # empty -> defaults to "<clusterName>-redis" 
  docker: dockerconfig
  honeybadger: honeybadger-api-key

smtp:
  enabled: false
  secretName: match-reference-architecture-smtp
  k8sSecretName: smtp-secrets

# GCS S3-interop HMAC creds for Active Storage. GCP-only — on AWS the
# app uses IRSA, so there is no static-credentials Secret. Disable when using
# native GCS + Workload Identity instead.
gcsS3Interop:
  enabled: true
  secretName: match-reference-architecture-gcs-hmac # tf-dt-gcs-active-storage hmac_secret_name
  k8sSecretName: match-s3-credentials               # consumed by helm-match (S3_ACCESS_KEY/S3_SECRET_KEY)
