{{- if .Values.httpRoute.enabled -}}
{{- /*
Gateway API HTTPRoute — the cloud-agnostic routing layer that replaces
the Ingress on Gateway-API clusters (GKE, on-prem). The cloud-specific Gateway is
owned by the infra layer; this route attaches to it via parentRefs. Gated on
httpRoute.enabled (default false) so the AWS Ingress path is unaffected.
*/}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "match.fullname" . }}
  labels:
    {{- include "match.labels" . | nindent 4 }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- range .Values.httpRoute.parentRefs }}
    - name: {{ .name }}
      {{- with .namespace }}
      namespace: {{ . }}
      {{- end }}
      {{- with .sectionName }}
      sectionName: {{ . }}
      {{- end }}
    {{- end }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames:
    {{- range . }}
    - {{ . | quote }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.httpRoute.rules }}
    - matches:
        {{- range .matches }}
        - path:
            type: {{ .path.type | default "PathPrefix" }}
            value: {{ .path.value | default "/" | quote }}
        {{- end }}
      backendRefs:
        # Same namespace as the route -> no ReferenceGrant needed.
        - name: {{ include "match.fullname" $ }}
          port: {{ $.Values.service.port }}
    {{- end }}
{{- end }}
