{{- if .Values.secretSyncer.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secret-syncer
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secret-syncer
  template:
    metadata:
      labels:
        app: secret-syncer
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      containers:
        - name: secret-syncer
          image: {{ .Values.secretSyncer.image }}
          command: ["sh", "-c", "sleep infinity"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 10m
              memory: 16Mi
          volumeMounts:
            - name: api-secrets
              mountPath: /mnt/api-secrets
              readOnly: true
            - name: docker-secrets
              mountPath: /mnt/docker-secrets
              readOnly: true
            - name: honeybadger-secrets
              mountPath: /mnt/honeybadger-secrets
              readOnly: true
            - name: user-secrets
              mountPath: /mnt/user-secrets
              readOnly: true
            - name: rds-secrets
              mountPath: /mnt/rds-secrets
              readOnly: true
            - name: redis-secrets
              mountPath: /mnt/redis-secrets
              readOnly: true
            {{- if .Values.smtp.enabled }}
            - name: smtp-secrets
              mountPath: /mnt/smtp-secrets
              readOnly: true
            {{- end }}
      volumes:
        - name: api-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ include "ascp.spcName" (dict "root" $ "component" "api") }}
        - name: docker-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ include "ascp.spcName" (dict "root" $ "component" "docker") }}
        - name: honeybadger-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ include "ascp.spcName" (dict "root" $ "component" "honeybadger") }}
        - name: user-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ include "ascp.spcName" (dict "root" $ "component" "owning-user-credentials") }}
        - name: rds-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ include "ascp.spcName" (dict "root" $ "component" "rds") }}
        - name: redis-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ include "ascp.spcName" (dict "root" $ "component" "redis") }}
        {{- if .Values.smtp.enabled }}
        - name: smtp-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ include "ascp.spcName" (dict "root" $ "component" "smtp") }}
        {{- end }}
{{- end }}
