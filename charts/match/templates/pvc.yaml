
{{- if and .Values.storage.sharedStorage.enabled .Release.IsInstall }}
{{- /* PVC is only rendered on fresh install — skipped on helm upgrade entirely.
       storageClassName is immutable once a PVC is bound, so any attempt to reconcile
       the spec on upgrade causes an SSA field-manager conflict.
       helm.sh/resource-policy: keep prevents Helm from orphan-deleting the PVC if it
       is ever dropped from the release manifest (e.g. on upgrades where it is not rendered). */}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.storage.sharedStorage.claimName }}
  annotations:
    helm.sh/resource-policy: keep
    {{- with .Values.storage.sharedStorage.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if .Values.useArgoSyncWaveAnnotations }}
    {{- toYaml .Values.storage.sharedStorage.argoSyncWaveAnnotations | nindent 4 }}
    {{- end }}
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: {{ .Values.storage.sharedStorage.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.storage.sharedStorage.size }}
{{- end }}
