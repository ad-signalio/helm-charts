apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "ascp.spcName" (dict "root" $ "component" "redis") }}
  namespace: {{ .Release.Namespace }}
spec:
  provider: aws                             
  parameters: 
    objects: |
        - objectName: "{{ .Values.redisSecretName }}"
          objectType: "secretsmanager"
          jmesPath:
          - path: "url"
            objectAlias: "url"
          - path: "elasticache_url"
            objectAlias: "elasticache_url"
          - path: "endpoint"
            objectAlias: "endpoint"
  secretObjects:
    - secretName: "{{ .Values.k8sSecretNames.redis | default (printf "%s-redis" .Values.clusterName) }}"
      type: Opaque
      data:
        - key: url
          objectName: url
        - key: elasticache_url
          objectName: elasticache_url
        - key: endpoint
          objectName: endpoint