{{- if .Values.gcsS3Interop.enabled }}
# GCS S3-interop HMAC creds -> "s3-credentials" (GCP-only; on AWS the app
# uses IRSA, so there is no static-credentials Secret 

# The platform chart reads S3_ACCESS_KEY <- access_key_id and S3_SECRET_KEY <-
# secret_access_key from this Secret (gated on gcsS3Interop.endpoint), pointing Active
# Storage's S3StreamingService at the GCS S3-interop XML API. Disable this when
# using native GCS + Workload Identity instead (no static creds needed).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: s3-credentials
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: {{ .Values.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secretStore.name }}
    kind: SecretStore
  target:
    name: {{ .Values.gcsS3Interop.k8sSecretName }}
    creationPolicy: Owner
  data:
    - secretKey: access_key_id
      remoteRef: { key: {{ .Values.gcsS3Interop.secretName }}, property: access_id }
    - secretKey: secret_access_key
      remoteRef: { key: {{ .Values.gcsS3Interop.secretName }}, property: secret }
{{- end }}
