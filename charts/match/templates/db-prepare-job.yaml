apiVersion: batch/v1
kind: Job
metadata:
  name: rails-prepare-job-{{ .Release.Revision }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "match.labels" . | nindent 4 }}
    app.kubernetes.io/component: db-prepare
  annotations:
    {{- with .Values.dbPrepareJob.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if .Values.useArgoSyncWaveAnnotations }}
    {{- toYaml .Values.dbPrepareJob.argoSyncWaveAnnotations | nindent 4 }}
    {{- else }}
    {{- toYaml .Values.dbPrepareJob.helmHookAnnotations | nindent 4 }}
    {{- end }}
spec:
  ttlSecondsAfterFinished: 86400 # 24 hours — Kubernetes cleans up without Helm deletion watch
  template:
    metadata:
      labels:
        {{- include "match.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: db-prepare
    spec:
      serviceAccountName: {{ include "match.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: Never
      containers:
        - name: rails-db-prepare
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          args: ["bin/rails", "db:prepare"]
          env:
           {{- include "match.envVars" . | nindent 12 }}
           {{- include "match.owningUserEnvVars" . | nindent 12 }}
          volumeMounts:
           {{- include "match.volumeMounts" . | nindent 12 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        {{- include "match.volumes" . | nindent 8 }}
